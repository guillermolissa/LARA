base_path: "."  # Root path prepended to all data/model paths. Change to an absolute path (e.g. "/mnt/data/project") to relocate the whole project.

data:
  raw: "data/raw"
  intermediate: "data/intermediate" 
  processed: "data/processed"
  features: "data/raw/clothes_features"
  min_session_length: 6 # Minimum session length to keep in the dataset after filtering low frequency items. Note: This is different from the context_length used in the model configuration which is the context length for the model.
  items_frequency: 5
  feature_store_dir: "data/train" # Directory for feature store
  train_feature_store: "train.parquet" # File name for the feature store
  test_feature_store: "test.parquet" # File name for the feature store
  sample: "data/sampled" # Path to the sampled data
  subset: "train" # Specify subset folder to be loaded. Allowed options are 'train' or 'test'. TODO: Change to 'test' for test set up
  tokenizer_path: "data/tokenizer-trivago.json" #"data/custom_tokenizer.json"
  tokenizer_build_path: "data/train/train.parquet" # Path to data for building tokenizer
  submission_dir: "data/submission" # Dir to save submission files
  train: "data/train" # Directory for training data
  test: "data/test" # Directory for test data
  meta_embedding_path: "data/meta/trivago" # Path to pretrained item metadata embeddings
  item_meta_embedding: "data/meta/item_meta_embeddings.pt"
  item_meta_id_map: "data/meta/item_id_to_index.json"
  

model:
  context_length: 10      # Context length
  emb_dim: 128            # Embedding dimension
  hidden_dim: 128         # Hidden dimension for LSTM
  n_heads: 2              # Number of attention heads
  n_layers: 1             # Number of layers
  drop_rate: 0.23          # Dropout rate
  qkv_bias: false         # Query-Key-Value bias
  model_type: "lstm"       # Model type options: "lstm" or "lara"
  model_type: "lstm"       # Model type
  cutoffs: [100, 1000, 9000] # Cutoffs for Adaptive Softmax (must all be < items_size)
  div_value: 4            # Div value for Adaptive Softmax
  use_meta_embeddings: true   # Add pretrained item metadata embeddings to token embeddings
  freeze_meta_embeddings: true # Keep metadata embeddings fixed during Transformer training
  tie_weights: true # Tie weights between input and output embeddings
  use_recency_bias : false # Whether to use recency bias in the model. If true, the model will learn a recency bias vector that is added to the output logits. This can help the model to better capture the recency effect in user behavior.
  recency_decay: 0.9 # Decay factor for recency bias. Only used if use_recency_bias is true. The recency bias vector is updated as follows: recency_bias = recency_decay * recency_bias + (1 - recency_decay) * new_recency_bias, where new_recency_bias is the recency bias computed from the current batch of data.



# Hyperparameters
hyperparameters:
  batch_size: 128
  learning_rate: 0.0005
  num_epochs: 30
  kfold : 5
  warmup_steps: 100
  weight_decay: 0.20
  num_accumulation_steps: 1
  max_grad_norm: 1.0
  label_smoothing: 0.2 # Label smoothing value
  evaluation_frequency: 500
  evaluation_num_batches: 10
  validation_ratio: 0.2
  device: "gpu" # Options: 'cuda', 'mps' or 'cpu'
  num_workers: 0 # Number of workers for DataLoader
  loss_fn: "linear_softmax" # Training objective for train_lstm_attention.py. ["linear_softmax" (cross-entropy), "adaptive_softmax", "bpr" (Bayesian Personalized Ranking)]
  bpr_num_negatives: 1 # Number of negative samples for BPR loss. Only used if oss_fn is "bpr"
  optimizer: "AdamW" # Optimizer type ["SGD", "AdamW"]
  seed: 42


experiment:
  wandb_api_key: "api-key-goes-here" # WandB API Key
  entity: "<entity>" 
  project: "<project>"
  run_id: "<run ID>"
  group: "experiment-<group>"
  resume: "allow" # Options: 'must', 'allow' or 'never' source: https://docs.wandb.ai/models/runs/resuming
  notes: "Notes for the experiment"

